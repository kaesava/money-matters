<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B2B4B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Layer 1: Background Rounded Tile -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="#F7F8FA" />

  <!-- Layer 2: Brand Watermark "K" (Light Ice Cyan #BAE6FD) -->
  <g fill="#BAE6FD">
    <!-- Left vertical stem -->
    <rect x="130" y="130" width="210" height="764" rx="24" />
    <!-- Diagonal arms -->
    <polygon points="330,430 670,130 880,130 460,500 880,890 670,890 330,570" />
  </g>

  <!-- Layer 3: Option 2 Donut Arc -->
  <g filter="url(#drop-shadow)">
    <path d="M 520,830 A 330,330 0 1,1 640,195" fill="none" stroke="#3B82F6" stroke-width="96" stroke-linecap="round" />
    <path d="M 640,195 A 330,330 0 0,1 760,280" fill="none" stroke="#06B6D4" stroke-width="96" />
    <path d="M 760,280 A 330,330 0 0,1 830,410" fill="none" stroke="#10B981" stroke-width="96" />
    <path d="M 830,410 A 330,330 0 0,1 835,530" fill="none" stroke="#F43F5E" stroke-width="96" stroke-linecap="round" />
  </g>
</svg>